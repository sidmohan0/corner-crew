[project]
name = "corner-crew"
version = "0.1.0"
description = "FastAPI multi-provider AI hackathon starter"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "openai>=2,<3",
    "pydantic-settings>=2,<3",
    "jsonschema>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
